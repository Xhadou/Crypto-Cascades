[project]
name = "crypto-cascades"
version = "2.0.0"
description = "FOMO Contagion in Cryptocurrency Networks using SEIR Epidemic Dynamics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "networkx>=3.1",
    "powerlaw>=1.5",
    "ndlib>=5.1.0",
    "EoN>=1.1",
    "requests>=2.28.0",
    "pycoingecko>=3.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "arch>=7.0",
    "lifelines>=0.29.0",
    "python-igraph>=0.11.0",
    "leidenalg>=0.11.0",
]

[project.optional-dependencies]
bayesian = ["numpyro>=0.15.0", "jax[cpu]>=0.4.0"]
fast = ["networkit>=11.0"]
viz = ["SciencePlots>=2.1"]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
]

[project.scripts]
crypto-cascades = "src.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
